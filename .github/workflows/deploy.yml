name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Nilai di bawah adalah kredensial publik Supabase (anon/publishable key):
      # memang ikut terkirim ke browser dan dilindungi RLS, bukan rahasia.
      # Timpa lewat Settings → Secrets and variables → Actions → Variables
      # dengan nama VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xpmnuepaeqkorewovdwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_XZBGjgAcP33kTbQ4Jac0DA_1W4FTNrI' }}
        run: npm run build

      # GitHub Pages tidak punya rewrite SPA: rute dalam seperti /shop akan 404.
      # Salinan index.html sebagai 404.html membuat router tetap mengambil alih.
      - name: Fallback SPA (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
